# vdreamer CI (Milestones 0 and 10 — docs/tasks.md).
#
# Jobs:
#   locked          — the committed uv.lock is the source of truth: lint, type-check,
#                      full test suite. Also proves `uv sync --locked --extra postgres`
#                      works from a clean checkout (Milestone-0 exit criterion).
#   floor           — `uv lock --resolution lowest-direct` (NOT committed): smoke
#                      tests against the minimum langchain/langgraph versions (A41).
#   latest          — `uv lock --upgrade` (NOT committed): smoke tests against the
#                      latest 1.x minor.
#   uv-independence  — the product scope: `uv build` a wheel, install it into a clean
#                      `python -m venv` with plain `pip`, and run the CLI. vdreamer
#                      must never require uv at runtime.
#   zero-egress     — `uv run --frozen --offline vdreamer doctor --offline`, which
#                      asserts zero egress with an in-process socket guard (§5.2).
#   airgap          — M10 exit: wheel + constraints + `vdreamer bundle` here, then a
#                      `--network none` container installs with plain pip (no uv),
#                      passes `doctor --offline` and runs the reference agent.
#   image           — the multi-stage OCI image: doctor + smoke run, network off.
#   release         — tags v*: wheel, sdist, constraints.txt, export-schema output.
#
# UV_PYTHON_DOWNLOADS=never: the dev toolchain never fetches interpreters
# (§5.2); actions/setup-python provides the pinned 3.11 (.python-version).

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: "never"

jobs:
  locked:
    name: locked (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Fail on lockfile drift
        run: uv lock --check
      - name: Prove the Milestone-0 exit criterion (clean sync of the postgres extra)
        run: uv sync --locked --extra postgres
      - name: Sync the full dev environment
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  floor:
    name: floor (lowest-direct, A41)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Resolve the pinned floor (lockfile is NOT committed)
        run: uv lock --resolution lowest-direct
      - name: Sync against the floor
        run: uv sync --frozen --all-extras
      - name: Print resolved floor pins
        run: uv run --frozen python -c "from importlib import metadata; print('langchain', metadata.version('langchain')); print('langgraph', metadata.version('langgraph'))"
      - name: Smoke-test the agent contract on the floor
        run: uv run --frozen pytest -m smoke

  latest:
    name: latest (upgrade, A41)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Resolve the latest 1.x minor (lockfile is NOT committed)
        run: uv lock --upgrade
      - name: Sync against the latest pins
        run: uv sync --frozen --all-extras
      - name: Print resolved latest pins
        run: uv run --frozen python -c "from importlib import metadata; print('langchain', metadata.version('langchain')); print('langgraph', metadata.version('langgraph'))"
      - name: Smoke-test the agent contract on the latest pins
        run: uv run --frozen pytest -m smoke

  uv-independence:
    name: plain-pip install (product scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
      - name: Build the wheel (dev side; sdist + wheel)
        run: uv build
      - name: Install into a clean python -m venv with plain pip
        run: |
          python -m venv .venv-pip
          .venv-pip/bin/pip install dist/vdreamer-*.whl
      - name: CLI works without uv (console script and module entry)
        run: |
          .venv-pip/bin/vdreamer --version
          .venv-pip/bin/python -m vdreamer --version
      - name: Validate a sample agent from the plain-pip install
        env:
          PYTHONPATH: examples/smoke
        run: .venv-pip/bin/vdreamer validate pinger:agent

  zero-egress:
    name: doctor --offline (zero egress, §5.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # `doctor --offline` asserts zero egress with an in-process socket guard
      # (blocks/records connect, create_connection, getaddrinfo while probing).
      # On self-hosted egress-blocked runners the VM network policy (A40) is the
      # authoritative control; the guard is defense in depth and the CI signal.
      - name: Sync frozen, without downloads
        run: uv sync --frozen --all-extras
      - name: Assert zero egress
        run: uv run --frozen --offline vdreamer doctor --offline

  # Milestone 10 exit (docs/tasks.md): a release wheel + `vdreamer bundle` on this
  # connected runner, then a fresh container with NO network and NO uv installs
  # it with plain pip, passes `doctor --offline`, and runs the reference agent.
  airgap:
    name: air-gapped install (bundle → --network none, §5.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
      - name: Release artifacts (dev side, uv) — wheel + hash-pinned constraints.txt
        run: |
          uv build
          uv export --frozen --no-dev --all-extras --no-emit-project --format requirements.txt -o constraints.txt
      - name: Bundle on the connected host with plain pip (no uv on PATH for this step)
        run: |
          python -m venv .venv-bundle
          .venv-bundle/bin/pip install dist/vdreamer-*.whl
          env -u UV PATH="$PWD/.venv-bundle/bin:/usr/bin:/bin" \
            vdreamer bundle --vdreamer "$(ls dist/vdreamer-*.whl)" --extra postgres \
              -c constraints.txt --out bundle
      - name: Install and run with egress blocked (docker --network none, no uv)
        run: |
          docker run --rm --network none \
            -v "$PWD/bundle:/bundle:ro" -v "$PWD/examples/smoke:/agents:ro" \
            python:3.11-slim sh -euxc '
              python -m venv /opt/vdreamer
              /opt/vdreamer/bin/pip install --no-index --find-links /bundle/wheelhouse \
                --require-hashes -r /bundle/requirements.lock
              ! command -v uv
              export TIKTOKEN_CACHE_DIR=/bundle/tiktoken
              /opt/vdreamer/bin/vdreamer doctor --offline
              PYTHONPATH=/agents /opt/vdreamer/bin/vdreamer validate pinger:agent
              PYTHONPATH=/agents /opt/vdreamer/bin/vdreamer dev --agent pinger:agent \
                --input "{\"message\": \"air-gapped\"}" --db /tmp/dev.db
            '

  image:
    name: OCI image (multi-stage, no uv at runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build vdreamer:ci
        run: docker build -t vdreamer:ci .
      - name: doctor --offline and a smoke run inside the image, network off
        run: |
          docker run --rm --network none vdreamer:ci doctor --offline
          docker run --rm --network none --entrypoint sh vdreamer:ci -c '! command -v uv'
          docker run --rm --network none -v "$PWD/examples/smoke:/agents:ro" \
            -e PYTHONPATH=/agents vdreamer:ci \
            dev --agent pinger:agent --input '{"message": "image"}' --db /tmp/dev.db

  # Each release (tag v*) attaches the wheel/sdist, the hash-pinned constraints.txt
  # (what `vdreamer bundle -c` installs against) and the export-schema output (§5.3, §6.1).
  release:
    name: release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [locked, airgap, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
      - name: Build, export constraints and the protocol contract
        run: |
          uv build
          uv export --frozen --no-dev --all-extras --no-emit-project --format requirements.txt -o dist/constraints.txt
          uv sync --locked
          uv run vdreamer export-schema --out dist/vdreamer-schema
          tar -C dist -czf dist/vdreamer-schema.tar.gz vdreamer-schema
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "vdreamer $GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/constraints.txt --clobber

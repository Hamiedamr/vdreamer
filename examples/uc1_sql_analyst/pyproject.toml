[project]
name = "vdreamer-example-sql-analyst"
version = "0.1.0"
description = "UC1 reference agent: SQL & data analysis over a Neo4j semantic layer (vdreamer PRD §7.3)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Plain pip works: `pip install ./examples/uc1_sql_analyst` (vdreamer from your index/wheelhouse).
dependencies = [
    "vdreamer[sql,neo4j,sandbox]",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_analyst"]

[tool.uv.sources]
vdreamer = { workspace = true }

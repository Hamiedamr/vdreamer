[project]
name = "vdreamer-example-site-validation"
version = "0.1.0"
description = "UC2 reference agent: headless telecom site & antenna validation (vdreamer PRD §7.3)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Plain pip works: `pip install ./examples/uc2_site_validation` (vdreamer from your index/wheelhouse).
dependencies = [
    "vdreamer[mcp,minio]",
]

[project.scripts]
site-inventory-mcp = "site_validation.inventory_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_validation"]

[tool.uv.sources]
vdreamer = { workspace = true }

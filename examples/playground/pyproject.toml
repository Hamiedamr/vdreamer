[project]
name = "vdreamer-example-playground"
version = "0.1.0"
description = "First-contact agents and LangChain/LangGraph docs examples served by vdreamer."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Plain pip works: `pip install ./examples/playground` (vdreamer from your index/wheelhouse).
dependencies = [
    "vdreamer[sandbox]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.uv.sources]
vdreamer = { workspace = true }

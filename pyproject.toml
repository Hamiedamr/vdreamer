[project]
name = "vdreamer"
version = "0.1.2"
description = "Serve LangGraph BaseAgent subclasses as a production REST/SSE API — zero generated server code, air-gap ready."
readme = "README.md"
license = "Apache-2.0"
# The vendored Swagger UI (Apache-2.0) and plotly.js (MIT) keep their own licenses,
# shipped next to them under vdreamer/gateway/static/vendor/ and listed in NOTICE.
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Abdelhamied", email = "abdelhamied.amr@outlook.com" },
]
requires-python = ">=3.11"
keywords = ["langgraph", "langchain", "agents", "llm", "sse", "fastapi", "air-gapped"]
# No `License ::` classifier: PEP 639 replaces it with the `license` expression above.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # Only what CI runs (.python-version, every job): add versions with their CI job.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
# A41: supported range is langchain 1.4+ and langgraph 1.2+ within 1.x; a 2.0 of
# either dependency requires a vdreamer major version.
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.143.0",
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "langchain>=1.4,<2",
    "langchain-ollama>=1.0",
    "langchain-openai>=1.1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
vdreamer = "vdreamer.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]
minio = [
    "minio>=7.2.20",
]
fastembed = [
    "fastembed>=0.9.0",
]
qdrant = [
    "qdrant-client>=1.19.1",
]
neo4j = [
    "neo4j>=6.4.0",
]
mcp = [
    "langchain[mcp]>=1.4,<2",
]
sandbox = [
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "numpy>=2.4.6",
    "xlsxwriter>=3.2",
]
sql = [
    "sqlalchemy[asyncio]>=2.0.40",
]

# The reference agents (PRD §7.3, Milestone 12) are workspace members: each depends on
# vdreamer through the workspace source, so they consume exactly this tree's public API.
[tool.uv.workspace]
members = ["examples/uc1_sql_analyst", "examples/uc2_site_validation", "examples/uc3_pdf_research", "examples/playground", "tutorials"]

[tool.uv.sources]
vdreamer-example-sql-analyst = { workspace = true }
vdreamer-example-site-validation = { workspace = true }
vdreamer-example-pdf-research = { workspace = true }
vdreamer-example-playground = { workspace = true }
vdreamer-tutorials = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vdreamer"]

[tool.hatch.build.targets.sdist]
# Local agent/editor config never ships.
exclude = [".claude/", ".agents/", ".opencode"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260906",
    "httpx>=0.28.1",
    "openapi-spec-validator>=0.9.0",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
    "vdreamer-example-sql-analyst",
    "vdreamer-example-site-validation",
    "vdreamer-example-pdf-research",
    "vdreamer-example-playground",
    "vdreamer-tutorials",
]
# Golden-event harness deps land with Milestone 2 (A31/A43), when the harness exists.

[tool.ruff]
target-version = "py311"
line-length = 100
# `.agents/` (and `.claude/` if present) hold installed agent skills —
# reference material, not vdreamer code.
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
# The [sandbox] extra's libraries ship no type information.
module = ["pyarrow", "pyarrow.*", "xlsxwriter", "xlsxwriter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: minimal agent contract checks, run against the floor and latest 1.x pins (A41)",
]

[project]
name = "vdreamer"
version = "0.1.0"
description = "Serve LangGraph BaseAgent subclasses as a production REST/SSE API — zero generated server code, air-gap ready."
readme = "README.md"
authors = [
    { name = "Abdelhamied", email = "abdelhamied.amr@outlook.com" },
]
requires-python = ">=3.11"
# A41: supported range is langchain 1.4+ and langgraph 1.2+ within 1.x; a 2.0 of
# either dependency requires a vdreamer major version.
dependencies = [
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.0",
    "pydantic>=2",
]

[project.scripts]
vdreamer = "vdreamer.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]
minio = [
    "minio>=7.2.20",
]
fastembed = [
    "fastembed>=0.9.0",
]
qdrant = [
    "qdrant-client>=1.19.1",
]
neo4j = [
    "neo4j>=6.4.0",
]
mcp = [
    "langchain[mcp]>=1.4,<2",
]
sandbox = [
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vdreamer"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
]
# Golden-event harness deps land with Milestone 2 (A31/A43), when the harness exists.

[tool.ruff]
target-version = "py311"
line-length = 100
# `.agents/` (and `.claude/` if present) hold installed agent skills —
# reference material, not vdreamer code.
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: minimal agent contract checks, run against the floor and latest 1.x pins (A41)",
]